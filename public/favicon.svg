<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Fondo redondeado con borde sutil -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="#60a5fa" stroke-width="1.5" />

  <!-- Gatillos superiores L/R -->
  <rect x="18" y="14" width="8" height="4" rx="2" fill="#93c5fd" />
  <rect x="38" y="14" width="8" height="4" rx="2" fill="#93c5fd" />

  <!-- Cuerpo ergonómico del mando -->
  <path
    d="M17 18 C12 18, 9 22, 10 32 C10.8 39.5, 13 46, 17 46 C20.5 46, 22.5 41, 25 38 C28 35, 36 35, 39 38 C41.5 41, 43.5 46, 47 46 C51 46, 53.2 39.5, 54 32 C55 22, 52 18, 47 18 Z"
    fill="url(#padGrad)"
  />

  <!-- Cruceta D-Pad izquierda -->
  <path d="M19 24 h4 v2.5 h2.5 v4 h-2.5 v2.5 h-4 v-2.5 h-2.5 v-4 h2.5 z" fill="#1e293b" />

  <!-- 4 Botones de acción derecha -->
  <!-- Arriba (Amarillo) -->
  <circle cx="45" cy="24.5" r="2" fill="#eab308" />
  <!-- Derecha (Rojo) -->
  <circle cx="48.5" cy="28.5" r="2" fill="#ef4444" />
  <!-- Abajo (Verde) -->
  <circle cx="45" cy="32.5" r="2" fill="#22c55e" />
  <!-- Izquierda (Azul) -->
  <circle cx="41.5" cy="28.5" r="2" fill="#3b82f6" />

  <!-- Botones centrales -->
  <circle cx="29.5" cy="26" r="1.3" fill="#64748b" />
  <circle cx="34.5" cy="26" r="1.3" fill="#64748b" />

  <!-- Sticks analógicos inferiores -->
  <circle cx="26" cy="33.5" r="3.3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" />
  <circle cx="38" cy="33.5" r="3.3" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.8" />
</svg>
